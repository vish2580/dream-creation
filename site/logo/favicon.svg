<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1c160e"/>
      <stop offset="1" stop-color="#070604"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5c0"/>
      <stop offset="0.45" stop-color="#fae082"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fae082"/>
      <stop offset="1" stop-color="#8c6208"/>
    </linearGradient>
  </defs>
  <!-- Luxury Obsidian Rounded Emblem with Gold Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="url(#gold)" stroke-width="5"/>
  <!-- Spire jewel -->
  <path d="M64 14 L69 24 L64 28 L59 24 Z" fill="#fff7cc"/>
  <!-- Peaked Wedding Mandap Canopy -->
  <path d="M64 26 L18 54 L110 54 Z" fill="url(#gold)" stroke="#241600" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 26 L44 54 L62 54 Z" fill="#8f6308" opacity="0.48"/>
  <path d="M64 26 L84 54 L100 54 Z" fill="#8f6308" opacity="0.48"/>
  <!-- Scalloped Canopy Trim -->
  <path d="M18 54 Q29.5 63 41 54 Q52.5 63 64 54 Q75.5 63 87 54 Q98.5 63 110 54" fill="none" stroke="#fff3b8" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Chandelier -->
  <line x1="64" y1="54" x2="64" y2="63" stroke="#fae082" stroke-width="2.6"/>
  <circle cx="64" cy="67" r="4.8" fill="#fff7cc" stroke="#9c6f09" stroke-width="1.5"/>
  <!-- Draped Side Curtains -->
  <path d="M25 56 C26.5 73 30 88 26 105 L36 105 C38 89 37 72 42 56 Z" fill="url(#goldDark)"/>
  <path d="M103 56 C101.5 73 98 88 102 105 L92 105 C90 89 91 72 86 56 Z" fill="url(#goldDark)"/>
  <!-- Stage Table & Base -->
  <path d="M46 86 L82 86 L79 104 L49 104 Z" fill="url(#gold)"/>
  <line x1="43" y1="86" x2="85" y2="86" stroke="#fff7d1" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="20" y1="106" x2="108" y2="106" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
</svg>

